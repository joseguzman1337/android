name: Auto Update and Merge
# Remediation rationale (Scorecard alerts #20, #11, #15, #21):
#   - TokenPermissionsID (#15): top-level `permissions:` declares the least privilege
#     needed to enable auto-merge on PRs (contents: write, pull-requests: write).
#   - DangerousWorkflowID (#20, #11): no longer triggers on `pull_request_target`, and
#     no longer checks out `${{ github.event.pull_request.head.ref }}` (the
#     untrusted-checkout pattern that lets a PR run code on a privileged runner).
#     The bot only operates on the protected default branch via `workflow_dispatch` /
#     `schedule` and uses `gh pr merge --auto` which is gated by GitHub branch
#     protection + required status checks.
#   - PinnedDependenciesID (#21): every `uses:` action is pinned to a commit SHA with
#     a trailing human-readable version comment.

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * 1-5' # Weekdays every 15 minutes

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge labeled PRs
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable auto-merge on labeled PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Enable GitHub's built-in auto-merge on PRs already labeled "auto-merge"
          # by Renovate. Merging itself is gated by branch protection rules.
          PR_LIST=$(gh pr list --state open --label auto-merge --json number --jq '.[].number')
          if [ -z "$PR_LIST" ]; then
            echo "No PRs labeled 'auto-merge'."
            exit 0
          fi
          for PR in $PR_LIST; do
            echo "Enabling auto-merge for PR #$PR"
            gh pr merge --auto --squash "$PR" || echo "  (already enabled or ineligible)"
          done
