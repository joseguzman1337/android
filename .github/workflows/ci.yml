name: CI Tests
# Remediation rationale (Scorecard SASTID + CITestsID):
#   - SASTID (#5): this workflow runs CodeQL static analysis and uploads the
#     SARIF results to the Security tab. With CodeQL enabled, the Scorecard
#     "SAST" check passes.
#   - CITestsID (no alert listed but added for completeness): lightweight
#     validation that the workflow YAMLs in this repo are well-formed and the
#     markdown lints cleanly.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 6 * * 1' # weekly

permissions:
  contents: read
  security-events: write

jobs:
  ci-tests:
    name: Validate workflow & docs
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate workflows
        run: |
          set -euo pipefail
          for f in .github/workflows/*.yml; do
            echo "Checking $f"
            python3 -c "import yaml,sys; list(yaml.safe_load_all(open('$f')))" \
              || { echo "::error::YAML invalid: $f"; exit 1; }
          done

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4dd16135b69a43b6c8efb853346f8437d92d3c93 # v4.31.0
        with:
          languages: actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.31.0
        with:
          category: "/language:actions"
